<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Space Check-In Kiosk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Top Header Navigation & Status Indicators */
        .top-bar {
            position: absolute;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: #94a3b8;
            backdrop-filter: blur(8px);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .reset-pass-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #64748b;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .reset-pass-btn:hover {
            color: #94a3b8;
            border-color: #475569;
        }

        /* Main Kiosk Card Layout */
        .kiosk-card {
            background: #1e293b;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Barcode Field Styling */
        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        #barcodeInput {
            width: 100%;
            padding: 1.25rem;
            font-size: 1.25rem;
            background-color: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            color: #ffffff;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #barcodeInput:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }

        /* Dynamic Feedback Area */
        #statusAlert {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 1rem;
            transition: opacity 0.3s;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Setup Overlay Modal */
        .setup-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .setup-modal {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .setup-modal h2 {
            color: #ffffff;
            font-size: 1.5rem;
        }

        .setup-modal input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 1.25rem 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .setup-modal input:focus {
            border-color: #3b82f6;
        }

        .setup-modal button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .setup-modal button:hover {
            background-color: #1d4ed8;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            <span>KIOSK ACTIVE</span>
        </div>
        <button class="reset-pass-btn" onclick="resetPassword()">Update Passcode</button>
    </div>

    <div class="kiosk-card">
        <h1>Shop Floor Check-In</h1>
        <p class="subtitle">Scan your badge to sign in or out</p>
        
        <div class="input-wrapper">
            <input type="text" id="barcodeInput" placeholder="Scan Barcode Here..." autofocus autocomplete="off">
        </div>

        <div id="statusAlert"></div>
    </div>

    <div id="setupOverlay" class="setup-overlay hidden">
        <div class="setup-modal">
            <h2>Kiosk Terminal Setup</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">Enter password to unlock this terminal session.</p>
            <input type="password" id="setupPass" placeholder="Enter Kiosk Password">
            <button onclick="savePassword()">Save & Start Kiosk</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('barcodeInput');
        const alertBox = document.getElementById('statusAlert');
        const setupOverlay = document.getElementById('setupOverlay');
        const setupPassInput = document.getElementById('setupPass');

        let kioskPassword = "";

        // Cookie Helpers
        function setCookie(name, value, days = 30) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
        }

        function getCookie(name) {
            return document.cookie.split('; ').reduce((r, v) => {
                const parts = v.split('=');
                return parts[0] === name ? decodeURIComponent(parts[1]) : r;
            }, '');
        }

        function eraseCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        // Initialize Kiosk
        function initKiosk() {
            kioskPassword = getCookie('kiosk_password');
            if (!kioskPassword) {
                setupOverlay.classList.remove('hidden');
                setupPassInput.focus();
            } else {
                setupOverlay.classList.add('hidden');
                input.focus();
            }
        }

        // Save password from setup modal
        function savePassword() {
            const val = setupPassInput.value.trim();
            if (val) {
                setCookie('kiosk_password', val);
                kioskPassword = val;
                setupPassInput.value = '';
                setupOverlay.classList.add('hidden');
                input.focus();
            }
        }

        function resetPassword() {
            eraseCookie('kiosk_password');
            kioskPassword = "";
            setupOverlay.classList.remove('hidden');
            setupPassInput.focus();
        }

        // Allow pressing Enter on password setup form
        setupPassInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') savePassword();
        });

        // Retain continuous focus on scanner input while operating
        document.addEventListener('click', (e) => {
            if (setupOverlay.classList.contains('hidden') && e.target !== document.querySelector('.reset-pass-btn')) {
                input.focus();
            }
        });

        // Scan Submission Handler (Processes Sanitized JSON API Response)
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const barcode = input.value.trim();
                input.value = '';

                if (!barcode) return;

                fetch('/kiosk/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: barcode, kiosk_password: kioskPassword })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        alertBox.className = "status-success";
                        alertBox.innerText = `✅ ${data.message}`;
                    } else {
                        alertBox.className = "status-error";
                        alertBox.innerText = `❌ ${data.message}`;
                    }
                })
                .catch(() => {
                    alertBox.className = "status-error";
                    alertBox.innerText = "❌ Network Communication Error";
                });
            }
        });

        initKiosk();
    </script>
</body>
</html>
